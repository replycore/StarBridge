# starbridge — Worker configuration.
# Secrets (ADMIN_TOKEN, GATEWAY_TOKEN, MASTER_KEY) are NOT here —
# they live in Cloudflare as secret_text bindings. Set them with:
#   wrangler secret put ADMIN_TOKEN / GATEWAY_TOKEN / MASTER_KEY
name = "starbridge"
main = "src/index.js"
compatibility_date = "2025-01-15"

# Custom domain: bind your own after deploy, e.g. api.example.com
workers_dev = false

[observability]
enabled = true

[triggers]
crons = ["13 1,7,13,19 * * *", "*/15 * * * *"]

[vars]
# ADMIN_ORIGIN is NOT in this file: it is a Worker secret, set with
#   wrangler secret put ADMIN_ORIGIN
# with your console domains, comma-separated (see docs/DEPLOY.md).
# The frontend origins allowed to call /admin/api/* from a browser.
DEFAULT_ALIAS = "auto"
KEEP_PER_FAMILY = "4"
MAX_ATTEMPTS = "6"
MODEL_GROUPING = "on"
PROBE_PER_SYNC = "0"
SYNC_ENABLED = "true"
UPSTREAM_TIMEOUT_MS = "120000"
# Split timeouts (item 12): header (first byte), idle (between stream
# chunks) and stream-max (total stream life) are independent knobs.
# Defaults equal the old single-timeout behaviour exactly — in
# particular the header default stays 120 s (decision 6), it is NOT
# lowered: reasoning models with a slow first byte must not die first.
UPSTREAM_HEADER_TIMEOUT_MS = "120000"
UPSTREAM_IDLE_TIMEOUT_MS = "120000"
UPSTREAM_STREAM_MAX_MS = "900000"
# Stream keepalive (item 11): SSE `: ping` after this long with no
# upstream chunk (default 15 s, 0 = off). A ping never resets the
# idle watchdog above — the two timers have different jobs.
STREAM_PING_MS = "15000"
# Write-budget floor (item 11): the passthrough pump aborts a client
# that cannot drain within remainingBytes/8192 + this floor
# (default 30 s). Env-overridable so the budget is testable.
STREAM_WRITE_BUDGET_FLOOR_MS = "30000"
# Circuit breaker: after this many consecutive transient upstream failures
# (server/network/timeout/unknown) for one provider key / model endpoint,
# it is cooled down for BREAKER_COOLDOWN_MS instead of being retried.
BREAKER_THRESHOLD = "3"
BREAKER_COOLDOWN_MS = "300000"
# Admin auth throttle: after this many consecutive failed /admin/api/*
# auth attempts from one client IP, that client is locked out (429) for
# ADMIN_AUTH_LOCKOUT_MS. A successful login resets the counter.
ADMIN_AUTH_MAX_FAILS = "10"
ADMIN_AUTH_LOCKOUT_MS = "900000"
# Session stickiness: how long an x-gw-session pin to one provider
# endpoint stays valid (see README). Stored in the Coordinator's
# persistent storage.
SESSION_TTL_MS = "1800000"

[[d1_databases]]
binding = "DB"
database_name = "starbridge"
# Create your own D1 database and put its ID here (see docs/DEPLOY.md).
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "GW_KV"
# Create your own KV namespace and put its ID here (see docs/DEPLOY.md).
id = "00000000-0000-0000-0000-000000000000"

[durable_objects]
bindings = [{ name = "COORD", class_name = "Coordinator" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]
